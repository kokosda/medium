services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: safe_debits
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d safe_debits"]
      interval: 1s
      timeout: 3s
      retries: 30

  tests:
    build:
      context: .
    volumes:
      - ./artifacts:/work/artifacts
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/safe_debits
    depends_on:
      postgres:
        condition: service_healthy
